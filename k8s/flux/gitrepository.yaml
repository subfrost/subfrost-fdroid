apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: subfrost-fdroid
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/subfrost/subfrost-fdroid
  ref:
    branch: master
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: subfrost-fdroid
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: subfrost-fdroid
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: fdroid
      namespace: subfrost-fdroid
  timeout: 3m
